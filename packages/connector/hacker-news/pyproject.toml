[project]
name = "cognee-community-connector-hacker-news"
version = "0.1.0"
description = "Hacker News connector for cognee — incremental topic sync with deletion reconciliation"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Document-mode routes source rows through cognify as prose documents.
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_hacker_news"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
